name: Sync apks from upstream

on:
  schedule:
    - cron: '30 * * * *'   # 每小时第 30 分钟（UTC）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync apks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 四个自维护项目 latest Release 的 apk 同步到对应目录
          # 远端已不存在的 apk 删除；内容不同才覆盖；无变化不提交
          PROJECTS="homeproxy luci-app-openvpn-server luci-app-quickfile luci-app-ipsec-vpnd"
          dir_of() {
            case "$1" in
              homeproxy)               echo homeproxy ;;
              luci-app-openvpn-server) echo openvpn-server ;;
              luci-app-quickfile)      echo quickfile ;;
              luci-app-ipsec-vpnd)     echo ipsec-vpnd ;;
            esac
          }
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          CHANGED=0
          api_get() {
            curl -fsSL --max-time 30 "$1" 2>/dev/null \
              || curl -fsSL --max-time 30 -H "Authorization: Bearer ${GH_TOKEN:-}" "$1"
          }
          apk_urls() { python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".apk")))'; }
          apk_names() { python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(a["name"] for a in d["assets"] if a["name"].endswith(".apk")))'; }
          for repo in $PROJECTS; do
            dir=$(dir_of "$repo")
            mkdir -p "$dir"
            echo "== $repo -> $dir =="
            json=$(api_get "https://api.github.com/repos/szwjp/$repo/releases/latest")
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              name=$(basename "$url")
              curl -fsSL --max-time 120 -o "$TMP/$name" "$url"
              echo "  downloaded: $name"
            done < <(printf '%s' "$json" | apk_urls)
            printf '%s' "$json" | apk_names > "$TMP/remote-names.txt"
            for f in "$dir"/*.apk; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              if ! grep -qx "$base" "$TMP/remote-names.txt"; then
                rm -f -- "$f"
                echo "  removed: $base"
                CHANGED=1
              fi
            done
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              if [ ! -f "$dir/$name" ] || ! cmp -s "$TMP/$name" "$dir/$name"; then
                cp "$TMP/$name" "$dir/$name"
                echo "  updated: $name"
                CHANGED=1
              fi
            done < "$TMP/remote-names.txt"
          done
          if [ "$CHANGED" = "1" ]; then
            git config user.name "szwjp"
            git config user.email "szwjp@users.noreply.github.com"
            git add -A homeproxy openvpn-server quickfile ipsec-vpnd
            git commit -m "sync: refresh apks from upstream latest releases"
            git push origin master
            echo ">>> 已提交并推送"
          else
            echo ">>> 无变化，跳过"
          fi
