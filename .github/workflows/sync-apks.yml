name: Sync apks from upstream

on:
  # schedule:  # 暂时屏蔽定时同步以节省 Actions 资源，需要时取消注释恢复
  #   - cron: '30 * * * *'   # 每小时第 30 分钟（UTC）
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/master'   # 只允许 master 触发，避免把其他分支状态推到 master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync apks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 自维护项目 latest Release 的 apk 同步到对应目录。
          # 每项目资产过滤：filter_of 指定匹配模式，未匹配的资产（其他 i18n/依赖合集）不下载。
          # 远端（过滤后）已不存在的 apk 删除；内容不同才覆盖；无变化不提交。
          PROJECTS="homeproxy luci-app-openvpn-server luci-app-quickfile luci-app-ipsec-vpnd openwrt-passwall2 openwrt-passwall"
          repo_of() {
            case "$1" in
              openwrt-passwall2)  echo "Openwrt-Passwall/openwrt-passwall2" ;;
              openwrt-passwall)   echo "Openwrt-Passwall/openwrt-passwall" ;;
              *)                  echo "szwjp/$1" ;;
            esac
          }
          dir_of() {
            case "$1" in
              homeproxy)               echo homeproxy ;;
              luci-app-openvpn-server) echo openvpn-server ;;
              luci-app-quickfile)      echo quickfile ;;
              luci-app-ipsec-vpnd)     echo ipsec-vpnd ;;
              openwrt-passwall2)       echo passwall2 ;;
              openwrt-passwall)        echo passwall ;;
            esac
          }
          filter_of() { # 资产名过滤模式（grep -E），默认全量 apk
            case "$1" in
              openwrt-passwall2) echo 'luci-app-passwall2-.*\.apk|luci-i18n-passwall2-zh-cn-.*\.apk' ;;
              openwrt-passwall)  echo '25\.12\+_luci-app-passwall-.*\.apk|25\.12\+_luci-i18n-passwall-zh-cn-.*\.apk' ;;
              *)                 echo '.*\.apk' ;;
            esac
          }
          preserve_of() { # 本地手工维护、删除对齐时需保留的资产模式（grep -E），默认不保留任何
            case "$1" in
              openwrt-passwall) echo '^(chinadns-ng|dns2socks|geoview|tcping|v2ray-geoip|v2ray-geosite)-' ;;
              *)                echo '^$' ;;
            esac
          }
          rename_of() { # 远端资产名 -> 本地文件名（去分支前缀等，符合 <name>-<version>-r<N>.apk 规范），默认原样
            case "$1" in
              openwrt-passwall) echo "$2" | sed 's/^25\.12+_//' ;; # BRE 中 + 是字面量（GNU sed 的 \+ 是量词），勿写 \+
              *)                echo "$2" ;;
            esac
          }
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          CHANGED=0
          api_get() {
            curl -fsSL --max-time 30 "$1" 2>/dev/null \
              || curl -fsSL --max-time 30 -H "Authorization: Bearer ${GH_TOKEN:-}" "$1"
          }
          apk_list() { python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(a["name"]+"\t"+a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".apk")))'; }
          for repo in $PROJECTS; do
            dir=$(dir_of "$repo")
            filter=$(filter_of "$repo")
            mkdir -p "$dir"
            echo "== $repo ($(repo_of "$repo")) -> $dir [filter: $filter] =="
            json=$(api_get "https://api.github.com/repos/$(repo_of "$repo")/releases/latest")
            if ! printf '%s' "$json" | apk_list | grep -E "$filter" > "$TMP/list.txt"; then
              echo "  警告：无匹配资产（filter: $filter），跳过 $repo（不下载不删除）"
              continue
            fi
            # 远端资产名 -> 本地文件名（rename_of），后续下载/删除/更新统一用本地名
            while IFS=$'\t' read -r name url; do
              [ -n "$name" ] || continue
              printf '%s\t%s\n' "$(rename_of "$repo" "$name")" "$url"
            done < "$TMP/list.txt" > "$TMP/list-local.txt" && mv "$TMP/list-local.txt" "$TMP/list.txt"
            while IFS=$'\t' read -r name url; do
              [ -n "$name" ] || continue
              curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --max-time 120 -o "$TMP/$name" "$url"
              echo "  downloaded: $name"
            done < "$TMP/list.txt"
            cut -f1 "$TMP/list.txt" > "$TMP/remote-names.txt"
            preserve=$(preserve_of "$repo")
            # 只对齐 git 跟踪的文件，未跟踪的手工文件（临时放置）不动
            # 注意：pathspec 必须是 "$dir/*.apk"（单模式限定目录），写成 "$dir" '*.apk' 两个模式是 OR 关系，会匹配全仓库
            git ls-files -- "$dir/*.apk" > "$TMP/tracked.txt"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              base=$(basename "$f")
              if ! grep -qx "$base" "$TMP/remote-names.txt" && ! printf '%s\n' "$base" | grep -qE "$preserve"; then
                rm -f -- "$f" # $f 已是相对仓库根路径（git ls-files 输出），不能加 $dir/ 前缀
                echo "  removed: $base"
                CHANGED=1
              fi
            done < "$TMP/tracked.txt"
            while IFS=$'\t' read -r name url; do
              [ -n "$name" ] || continue
              if [ ! -f "$dir/$name" ] || ! cmp -s "$TMP/$name" "$dir/$name"; then
                cp "$TMP/$name" "$dir/$name"
                echo "  updated: $name"
                CHANGED=1
              fi
            done < "$TMP/list.txt"
            # 记录远端资产（带目录前缀），提交时只 add 这些 + 已跟踪文件的变更
            cut -f1 "$TMP/list.txt" | sed "s|^|$dir/|" >> "$TMP/to-add.txt"
          done
          if [ "$CHANGED" = "1" ]; then
            git config user.name "szwjp"
            git config user.email "szwjp@users.noreply.github.com"
            # 只提交远端资产（to-add.txt）与已跟踪文件的变更；未跟踪的手工文件（临时放置）不进版本库，避免下轮被误删
            # add -u 按目录逐个执行：全新目录（尚无已跟踪文件）会 pathspec 报错，忽略且不影响其他目录
            for d in homeproxy openvpn-server quickfile ipsec-vpnd passwall2 passwall; do
              git add -u -- "$d" 2>/dev/null || true
            done
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              git add -- "$f" 2>/dev/null || true
            done < "$TMP/to-add.txt"
            git commit -m "sync: refresh apks from upstream latest releases"
            pushed=0
            for i in 1 2 3; do
              # pull --rebase 吸收并发提交，避免浅克隆 push 非快进失败；失败自动重试
              if git pull --rebase origin master && git push origin master; then
                pushed=1
                break
              fi
              echo "  push 失败，5 秒后重试 ($i/3)"
              sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo ">>> 推送失败：本地已提交但未能推送，需要人工处理"
              exit 1
            fi
            echo ">>> 已提交并推送"
          else
            echo ">>> 无变化，跳过"
          fi
